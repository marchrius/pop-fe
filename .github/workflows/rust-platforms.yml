name: Rust platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.macos }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: 26
            arch: Intel
            artifact_arch: x86_64
            runner: macos-26-intel
          - macos: 26
            arch: Apple Silicon
            artifact_arch: aarch64
            runner: macos-26
          - macos: 27-preview
            arch: Apple Silicon
            artifact_arch: aarch64
            runner: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: brew install gtk4 libadwaita opencv libsndfile openssl@3 llvm pkg-config cmake ffmpeg poppler sevenzip rom-tools xdelta dylibbundler librsvg
      - name: Build application
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)" \
          OPENSSL_LIB_DIR="$(brew --prefix openssl@3)/lib" \
          OPENSSL_INCLUDE_DIR="$(brew --prefix openssl@3)/include" \
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}" \
          LIBCLANG_PATH="$(brew --prefix llvm)/lib" \
          DYLD_LIBRARY_PATH="$(brew --prefix llvm)/lib:${DYLD_LIBRARY_PATH}" \
          RUSTFLAGS="-L native=$(brew --prefix openssl@3)/lib" \
          cargo build --locked --release
      - name: Build ATRAC3 encoder
        run: |
          cmake -S atracdenc/src -B target/atracdenc-build -DCMAKE_BUILD_TYPE=Release
          cmake --build target/atracdenc-build --parallel
      - name: Package macOS app
        run: python3 packaging/build_macos_app.py
      - uses: actions/upload-artifact@v6
        with:
          name: pop-fe-psp-macos-${{ matrix.macos }}-${{ matrix.artifact_arch }}
          path: dist/pop-fe-psp-macos-*.zip

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-7zip
            xdelta3
      - name: Install Rust GNU toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - name: Build application
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          LIBCLANG_PATH: /ucrt64/bin
        run: cargo +stable-x86_64-pc-windows-gnu build --locked --release
      - name: Build ATRAC3 encoder
        shell: msys2 {0}
        run: |
          cmake -S atracdenc/src -B target/atracdenc-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build target/atracdenc-build --parallel
      - name: Package portable Windows ZIP
        shell: msys2 {0}
        run: python packaging/build_windows_portable.py
      - uses: actions/upload-artifact@v6
        with:
          name: pop-fe-psp-windows-x86_64
          path: dist/pop-fe-psp-windows-x86_64.zip

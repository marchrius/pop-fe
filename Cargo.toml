[package]
name = "pop-fe-psp"
version = "0.1.6"
edition = "2024"
rust-version = "1.85"
description = "GTK4 application for converting and extracting PlayStation disc images for PSP"
license = "LGPL-2.1-or-later"

[[bin]]
name = "pop-fe-psp"
path = "src/main.rs"
required-features = ["gui"]

[lib]
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[dependencies]
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_5"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.11"
regex = "1.12"
thiserror = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

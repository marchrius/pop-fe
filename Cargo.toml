[package]
name = "pop-fe-psp"
version = "0.1.92"
edition = "2024"
rust-version = "1.86"
description = "GTK4 application for converting and extracting PlayStation disc images for PSP"
license = "LGPL-2.1-or-later"

[[bin]]
name = "pop-fe-psp"
path = "src/main.rs"
required-features = ["gui"]

[lib]
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw", "dep:gdk-pixbuf", "dep:reqwest", "dep:tokio", "dep:cairo"]

[dependencies]
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_5"], optional = true }
gdk-pixbuf = { version = "0.21.5", optional = true }
cairo = { package = "cairo-rs", version = "0.21.5", features = ["png"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
tokio = { version = "1.52.3", features = ["macros", "rt", "time"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
md-5 = "0.11"
regex = "1.12"
thiserror = "2.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha1 = "0.11"
zip = { version = "2.4.2", default-features = false, features = ["deflate-miniz"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
